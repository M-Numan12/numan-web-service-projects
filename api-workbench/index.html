<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Interactive REST API workbench concept by Muhammad Numan."><title>Endpoint — API Workbench</title><style>
:root{--bg:#0b0e12;--panel:#11161d;--line:#29313c;--muted:#8390a1;--green:#a3e635;--blue:#67e8f9;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#edf2f7;background:var(--bg)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#0b0e12,#0d1319)}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:24px 17px;background:#0d1116}.brand{font-weight:900;font-size:19px}.brand b{color:var(--green)}.side small{display:block;color:#576371;margin:30px 8px 10px;font-size:10px}.endpoint{width:100%;border:0;background:transparent;color:#aeb8c5;border-radius:7px;padding:10px 8px;text-align:left;cursor:pointer;font-size:12px}.endpoint:hover,.endpoint.active{background:#181e26;color:#fff}.method{font-size:9px;font-weight:900;margin-right:8px}.get{color:var(--green)}.post{color:var(--blue)}.delete{color:#fb7185}.main{padding:26px 30px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:26px;margin:5px 0}.eyebrow{color:var(--green);font-size:10px;font-weight:900;letter-spacing:.12em}.env{border:1px solid var(--line);background:#121821;color:#fff;border-radius:7px;padding:9px}.request{display:grid;grid-template-columns:110px 1fr 110px;gap:8px;margin:28px 0 14px}.request select,.request input,textarea{border:1px solid var(--line);background:#10151c;color:#fff;border-radius:7px;padding:12px}.request button{border:0;border-radius:7px;background:var(--green);color:#132006;font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{border:1px solid var(--line);border-radius:11px;background:var(--panel);overflow:hidden}.panel-head{height:47px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:12px}.tabs{display:flex;gap:18px}.tabs b{color:var(--green)}.panel textarea{width:100%;min-height:420px;border:0;border-radius:0;resize:none;line-height:1.7;font-size:12px}.response{min-height:420px;padding:17px;white-space:pre-wrap;color:#cbd5e1;font-size:12px;line-height:1.7}.response .key{color:var(--blue)}.status{color:var(--green)}.history{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:11px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}@media(max-width:780px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:20px 13px}.grid{grid-template-columns:1fr}.request{grid-template-columns:90px 1fr}.request button{grid-column:1/-1;padding:11px}.panel textarea,.response{min-height:300px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">end<b>point</b></div><small>CRM API</small><button class="endpoint active" data-method="GET" data-path="/api/v1/customers"><span class="method get">GET</span>Customers</button><button class="endpoint" data-method="GET" data-path="/api/v1/deals"><span class="method get">GET</span>Deals</button><button class="endpoint" data-method="POST" data-path="/api/v1/leads"><span class="method post">POST</span>Create lead</button><small>OPERATIONS API</small><button class="endpoint" data-method="GET" data-path="/api/v1/inventory"><span class="method get">GET</span>Inventory</button><button class="endpoint" data-method="POST" data-path="/api/v1/orders"><span class="method post">POST</span>Create order</button><button class="endpoint" data-method="DELETE" data-path="/api/v1/orders/1042"><span class="method delete">DEL</span>Cancel order</button></aside><main class="main"><div class="top"><div><span class="eyebrow">REST API CONSOLE</span><h1>Request workbench</h1></div><select class="env"><option>Development</option><option>Staging</option><option>Production (read-only)</option></select></div><div class="request"><select id="method"><option>GET</option><option>POST</option><option>PATCH</option><option>DELETE</option></select><input id="path" value="/api/v1/customers"><button id="send">Send request →</button></div><div class="grid"><section class="panel"><div class="panel-head"><div class="tabs"><b>Body</b><span>Headers</span><span>Auth</span></div><span>JSON</span></div><textarea id="payload" spellcheck="false">{
  "name": "Northstar Retail",
  "email": "ops@northstar.test",
  "service": "ERP implementation"
}</textarea></section><section class="panel"><div class="panel-head"><div class="history"><i class="dot"></i><b class="status" id="status">200 OK</b><span id="time">128 ms</span></div><span id="size">1.2 KB</span></div><pre class="response" id="response">{
  <span class="key">"data"</span>: [
    { <span class="key">"id"</span>: 1042, <span class="key">"name"</span>: "Northstar Retail", <span class="key">"status"</span>: "active" },
    { <span class="key">"id"</span>: 1043, <span class="key">"name"</span>: "Atlas Learning", <span class="key">"status"</span>: "active" }
  ],
  <span class="key">"meta"</span>: { <span class="key">"page"</span>: 1, <span class="key">"total"</span>: 2 }
}</pre></section></div></main></div><script>
const method=document.querySelector('#method'),path=document.querySelector('#path'),payload=document.querySelector('#payload'),response=document.querySelector('#response'),status=document.querySelector('#status');document.querySelectorAll('.endpoint').forEach(b=>b.onclick=()=>{document.querySelectorAll('.endpoint').forEach(x=>x.classList.remove('active'));b.classList.add('active');method.value=b.dataset.method;path.value=b.dataset.path});document.querySelector('#send').onclick=()=>{status.textContent='Sending…';response.textContent='';setTimeout(()=>{let body;try{body=JSON.parse(payload.value)}catch{body={note:'No valid request body supplied'}}const m=method.value;status.textContent=m==='POST'?'201 Created':m==='DELETE'?'204 No Content':'200 OK';document.querySelector('#time').textContent=(86+Math.floor(Math.random()*90))+' ms';document.querySelector('#size').textContent=m==='DELETE'?'0 B':'0.8 KB';response.textContent=m==='DELETE'?'':JSON.stringify({success:true,request:{method:m,path:path.value},data:m==='GET'?[{id:1042,name:'Northstar Retail',status:'active'},{id:1043,name:'Atlas Learning',status:'active'}]:{id:1044,...body,createdAt:new Date().toISOString()}},null,2)},500)};
</script></body></html>
